```yaml
name: Build VR Viewer IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar VR Viewer
    runs-on: macos-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Seleccionar Xcode
        run: |
          xcodebuild -version

      - name: Buscar proyecto y esquemas
        run: |
          find . -name "*.xcodeproj" -print
          xcodebuild -list -project "2 VR Viewer.xcodeproj"

      - name: Compilar aplicación
        run: |
          xcodebuild \
            -project "2 VR Viewer.xcodeproj" \
            -scheme "2 VR Viewer" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA sin firma
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "No se encontró la aplicación compilada."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VRViewer-unsigned.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: VRViewer-unsigned-IPA
          path: VRViewer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
```
