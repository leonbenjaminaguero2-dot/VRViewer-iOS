name: Build VR Viewer IPA

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Xcode
        run: xcodebuild -version

      - name: Find project
        run: |
          find . -name '*.xcodeproj' -print

      - name: List schemes
        run: |
          xcodebuild -list -project 'VR Viewer.xcodeproj'
